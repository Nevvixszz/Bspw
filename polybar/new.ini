;==========================================================
;   ГОТОВЫЙ РАБОЧИЙ КОНФИГ POLYBAR
;   Источник: github.com/stokedponcho/dotfiles
;==========================================================

[global/wm]
margin-top = 0
margin-bottom = 0

[settings]
screenchange-reload = true
pseudo-transparency = true

[colors]
background = #1E1F2C
background-alt = #282A36
foreground = #F8F8F2
foreground-alt = #6272A4
primary = #BD93F9
secondary = #FFB86C
alert = #FF5555
disabled = #6272A4

[bar/main]
monitor = ${env:MONITOR}
width = 100%
height = 30
wm-restack = bspwm
override-redirect = true
enable-ipc = true

background = ${colors.background}
foreground = ${colors.foreground}
line-size = 0
border-size = 0

padding-left = 10
padding-right = 10
module-margin-left = 2
module-margin-right = 2

; Шрифты (замени на то что установлено)
font-0 = "Fira Code:size=11;2"
font-1 = "Font Awesome 6 Free:style=Solid:size=11;2"

; Модули
modules-left = bspwm xwindow
modules-center = date
modules-right = battery pulseaudio powermenu

tray-position = right

cursor-click = pointer
cursor-scroll = ns-resize

[module/bspwm]
type = internal/bspwm
pin-workspaces = true
label-focused = ●
label-focused-foreground = ${colors.primary}
label-focused-padding = 2
label-occupied = ●
label-occupied-foreground = ${colors.secondary}
label-occupied-padding = 2
label-urgent = ●
label-urgent-foreground = ${colors.alert}
label-empty = ○
label-empty-foreground = ${colors.foreground-alt}
label-empty-padding = 2

[module/xwindow]
type = internal/xwindow
label = %title:0:40:...%
label-empty = ❌ Нет окна
label-empty-foreground = ${colors.alert}

[module/date]
type = internal/date
date = %H:%M  %d.%m.%Y
date-alt = %A, %d %B %Y
label = %date%

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 100
format-charging = <ramp-capacity> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
label-charging =  %percentage%%
label-discharging = %percentage%%
ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
ramp-capacity-0-foreground = ${colors.alert}
ramp-capacity-1-foreground = ${colors.secondary}
ramp-capacity-2-foreground = ${colors.primary}
ramp-capacity-3-foreground = ${colors.foreground}
ramp-capacity-4-foreground = ${colors.foreground}

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
label-muted =  muted
ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
click-right = pavucontrol &

[module/powermenu]
type = custom/menu
expand-right = true
format-spacing = 1
label-open = 
label-open-foreground = ${colors.alert}
label-close = 
label-separator = |
menu-0-0 =  reboot
menu-0-0-exec = menu-open-1
menu-0-1 =  power off
menu-0-1-exec = menu-open-2
menu-1-0 =  cancel
menu-1-0-exec = menu-open-0
menu-1-1 =  reboot
menu-1-1-exec = systemctl reboot
menu-2-0 =  power off
menu-2-0-exec = systemctl poweroff
menu-2-1 =  cancel
menu-2-1-exec = menu-open-0
