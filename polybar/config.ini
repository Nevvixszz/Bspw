; =====================================================
;                МАКСИМАЛЬНО КРАСИВЫЙ БАР
; =====================================================

[colors]
; Основные цвета (можно менять под настроение)
background = #1E1F2C
background-alt = #282A36
foreground = #F8F8F2
red = #FF5555
green = #50FA7B
yellow = #F1FA8C
blue = #BD93F9
magenta = #FF79C6
cyan = #8BE9FD
orange = #FFB86C

[bar/main]
; Внешний вид
width = 100%
height = 40
radius = 0
fixed-center = false

background = ${colors.background}
foreground = ${colors.foreground}

; Отступы и позиция
bottom = false
padding-left = 10
padding-right = 10
module-margin-left = 5
module-margin-right = 5

; Шрифты (установи Nerd Fonts для иконок!)
font-0 = "JetBrainsMono Nerd Font:size=12;2"
font-1 = "Noto Sans CJK JP:size=11;2"  ; для японского
font-2 = "Font Awesome 6 Free:style=Solid;2"

; Модули
modules-left = koneko bspwm-dots
modules-center = date-ip
modules-right = xwindow battery poweroff

; Клик по пустому месту бара
click-left = #xwindow.next
; =====================================================
; 1. КАНЕКИ КЕН (картинка)
; =====================================================
[module/koneko]
type = custom/script
exec = echo "%{T2}󰆀%{T-}"  ; Иконка "дом", если картинка не грузится
; Если хочешь реальное изображение через imagemagick:
; exec = echo "%{A:echo 'Канеки Кен':}%{T2}󰆀%{T-}%{A}"
exec-if = test -f ~/.config/polybar/koneko.png
interval = 86400
click-left = notify-send "Канеки Кен" "Я просто красивый значок ✨"
label = %output%
; =====================================================
; 2. ДАТА + ВРЕМЯ (объединены)
; =====================================================
[module/date-ip]
type = internal/date
date = %H:%M  %d.%m.%Y
date-alt = %A, %d %B %Y
label = %date%
; =====================================================
; 3. IP АДРЕС (внешний)
; =====================================================
[module/ip]
type = custom/script
exec = ~/.config/bspwm/scripts/get_ip.sh
interval = 30
label = %output%
; =====================================================
; 4. РАЗНОЦВЕТНЫЕ ТОЧКИ ДЛЯ ОКОН (BSPWM)
; =====================================================
[module/bspwm-dots]
type = internal/bspwm
; Настройка иконок для разных состояний
label-focused = %icon% 
label-focused-foreground = ${colors.red}
label-focused-background = ${colors.background}
label-focused-padding = 0

label-occupied = %icon% 
label-occupied-foreground = ${colors.orange}
label-occupied-background = ${colors.background}
label-occupied-padding = 0

label-urgent = %icon% 
label-urgent-foreground = ${colors.red}
label-urgent-padding = 0

label-empty = %icon% 
label-empty-foreground = ${colors.foreground}
label-empty-background = ${colors.background}
label-empty-padding = 0

; Иконки вместо точек (●)
icon-focused = ●
icon-occupied = ●
icon-urgent = ●
icon-empty = ○
; =====================================================
; 5. НАЗВАНИЕ ТЕКУЩЕГО ОКНА
; =====================================================
[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%
label-empty = ❌️ Нет окна
label-empty-foreground = ${colors.red}
; =====================================================
; 6. БАТАРЕЯ (с цветовой индикацией)
; =====================================================
[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 100

; Иконки уровня заряда
battery-ramp-0 = 
battery-ramp-1 = 
battery-ramp-2 = 
battery-ramp-3 = 
battery-ramp-4 = 

; Цвета в зависимости от уровня
ramp-capacity-0-foreground = ${colors.red}
ramp-capacity-1-foreground = ${colors.orange}
ramp-capacity-2-foreground = ${colors.yellow}
ramp-capacity-3-foreground = ${colors.green}
ramp-capacity-4-foreground = ${colors.green}

label-charging =  %percentage%%
label-discharging = %ramp% %percentage%%
label-full =  %percentage%%
; =====================================================
; 7. КНОПКА ВЫКЛЮЧЕНИЯ (кликабельная)
; =====================================================
[module/poweroff]
type = custom/text
content = 
content-foreground = ${colors.red}
click-left = systemctl poweroff
click-right = systemctl reboot
