# picom.conf — прозрачность для всех окон
backend = "xrender";

vsync = true;

# Прозрачность для всех окон (50%)
opacity-rule = [
  "90:class_g = '*'"
];

# Активные окна чуть ярче
focus-exclude = [];
inactive-opacity = 0.85;
active-opacity = 1.0;

# Эффекты затухания
fading = true;
fade-delta = 4;
